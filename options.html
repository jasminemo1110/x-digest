<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X Digest Settings</title></head>
  <body>
    <main>
      <h1>X Digest Settings</h1>
      <p>V1 uses one DeepSeek key for opt-in translation, explanation, and summaries. It is stored only in this Chrome profile.</p>
      <form id="settingsForm">
        <label for="apiKey">DeepSeek API key</label>
        <input id="apiKey" type="password" autocomplete="off" spellcheck="false">
        <button type="submit">Save</button>
        <span id="status" role="status"></span>
      </form>
    </main>
    <script src="settings.js"></script><script src="options.js"></script>
  </body>
</html>
